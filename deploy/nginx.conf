# twinpeaksbreakdowns.com: the static Angular build that CI rsyncs into the web root.
# setup-server.sh installs this as /etc/nginx/sites-available/twinpeaksbreakdowns.com,
# then Certbot adds the HTTPS listener and the redirect from HTTP.
server {
    listen 80;
    server_name twinpeaksbreakdowns.com www.twinpeaksbreakdowns.com;

    root /var/www/twinpeaksbreakdowns.com/html;
    index index.html;

    gzip_types text/css application/javascript application/json image/svg+xml;

    # Bundles carry a content hash in their names, so they never change.
    location ~* "-[a-z0-9]{8}\.(?:js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Every other path is an Angular route: serve the app and let the router decide,
    # including the Red Room for addresses that don't exist.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
